name: Release

# Release manually from the Actions tab
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being built, e.g. 0.1.0"
        required: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest runner still offered, so the binary keeps working on older distributions
          - platform: linux
            runner: ubuntu-22.04
            suffix: x86_64-qt-bundle.AppImage
          - platform: windows
            runner: windows-2022
            suffix: windows-x64.zip

    env:
      PACKAGE: FriedProjectManager-${{ inputs.version }}-${{ matrix.suffix }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev libxkbcommon-dev imagemagick \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Lay out the AppDir
        if: matrix.platform == 'linux'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/fried_project_manager AppDir/usr/bin/
          cp packaging/linux/fried-project-manager.desktop AppDir/usr/share/applications/

          # A stand-in until the tool has artwork of its own; replace this line with the real icon.
          convert -size 256x256 xc:"#3c3c3c" AppDir/usr/share/icons/hicolor/256x256/apps/fried-project-manager.png

          # Copied before anything is bundled into it, so this one stays bare.
          cp -r AppDir SystemQtDir

          # appimagetool reads these from the top of the directory, while linuxdeploy writes its own.
          ln -s usr/bin/fried_project_manager SystemQtDir/AppRun
          cp packaging/linux/fried-project-manager.desktop SystemQtDir/
          cp SystemQtDir/usr/share/icons/hicolor/256x256/apps/fried-project-manager.png SystemQtDir/
          cp SystemQtDir/fried-project-manager.png SystemQtDir/.DirIcon

      - name: Package the AppImage that carries Qt
        if: matrix.platform == 'linux'
        run: |
          releases=https://github.com/linuxdeploy
          curl -fsSLO $releases/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $releases/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          # Unpacking the tools instead of mounting them keeps FUSE out of the runner.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="${{ env.PACKAGE }}"

          # Stripping fails on any library the runner built with a section its own strip
          # predates, and all it buys is a smaller download.
          export NO_STRIP=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

      - name: Package the AppImage that uses the system Qt
        if: matrix.platform == 'linux'
        run: |
          curl -fsSLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          ./appimagetool-x86_64.AppImage SystemQtDir \
            "FriedProjectManager-${{ inputs.version }}-x86_64-system-qt.AppImage"

      - name: Package with the Qt libraries
        if: matrix.platform == 'windows'
        run: |
          mkdir package
          copy build\Release\fried_project_manager.exe package\
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler package\fried_project_manager.exe
          Compress-Archive -Path package\* -DestinationPath "${{ env.PACKAGE }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fried-project-manager-${{ inputs.version }}-${{ matrix.platform }}
          path: FriedProjectManager-*
          if-no-files-found: error

  release:
    name: draft
    needs: build
    runs-on: ubuntu-latest

    # Creating a release writes to the repository
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          gh release create "v${{ inputs.version }}" assets/* \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }} \
            --title "Fried Project Manager ${{ inputs.version }}" \
            --generate-notes \
            --draft
